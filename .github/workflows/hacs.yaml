---
name: hacs

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
          ignore: brands images
